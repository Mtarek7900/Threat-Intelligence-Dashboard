spring:
  application:
    name: threat-intelligence-dashboard
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tid}
    username: ${DATABASE_USERNAME:tid}
    password: ${DATABASE_PASSWORD:tid}

tid:
  sources:
    # How long each Source gets to answer before its Source Result is Not Checked
    timeout: ${SOURCE_TIMEOUT:10s}
    virustotal:
      base-url: ${VIRUSTOTAL_BASE_URL:https://www.virustotal.com}
      api-key: ${VIRUSTOTAL_API_KEY:}
  verdict:
    virustotal:
      # Engines flagging the Indicator for a Malicious Signal, and for a Suspicious one below that
      malicious-engines: ${VERDICT_VIRUSTOTAL_MALICIOUS_ENGINES:3}
      suspicious-engines: ${VERDICT_VIRUSTOTAL_SUSPICIOUS_ENGINES:1}
